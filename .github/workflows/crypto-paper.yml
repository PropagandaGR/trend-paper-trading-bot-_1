name: Crypto Paper Trading Research

on:
  push:
    branches: [crypto-paper-trading]
    paths-ignore:
      - "state/**"
      - "reports/**"
  workflow_dispatch:
  schedule:
    # Best-effort every 5 minutes; not a low-latency service.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-paper-trading
  cancel-in-progress: false

jobs:
  crypto-research-and-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out crypto branch
        uses: actions/checkout@v4
        with:
          ref: crypto-paper-trading
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run historical walk-forward and cost research
        run: python crypto_research.py --days 90
      - name: Update paper portfolio from public spot data
        run: python crypto_paper_bot.py --once
      - name: Commit reports and simulated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/crypto_paper_state.json reports/crypto_latest.json reports/research_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Update crypto paper research and portfolio"
            git push origin HEAD:crypto-paper-trading
          fi
